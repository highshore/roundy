name: CTA contract repair integration
on:
  push:
    branches: ['fix/marketing-cta-contract-recovery']
    paths:
      - 'scripts/apply-marketing-cta-fix.mjs'
      - 'scripts/apply-marketing-recovery-tests.mjs'
      - 'scripts/test-marketing-output-recovery.mjs'
      - 'src/lib/marketing-output-recovery.ts'
      - 'src/lib/marketing-research-task.ts'
      - '.github/workflows/marketing-cta-fix-once.yml'
permissions:
  contents: write
concurrency:
  group: roundy-cta-contract-integration
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-cta-contract-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-marketing-cta-fix.mjs
      - run: node scripts/apply-marketing-recovery-tests.mjs
      - run: npm run typecheck
      - run: node scripts/test-marketing-output-recovery.mjs
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs
      - run: node scripts/test-marketing-compact.mjs
      - run: node scripts/test-marketing-renderer.mjs
      - run: node scripts/test-marketing-draft-inbox.mjs
      - name: Commit verified production code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/test-marketing-compact-runtime.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Fix server-owned CTA validation and recover saved failures with zero paid requests'
            git push origin HEAD:fix/marketing-cta-contract-recovery
          fi
