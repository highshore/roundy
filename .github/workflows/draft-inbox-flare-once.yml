name: Draft inbox Flare integration
on:
  push:
    branches: ['feature/marketing-draft-inbox-image-flare']
    paths: ['scripts/apply-draft-inbox-image-flare.mjs']
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/marketing-draft-inbox-image-flare
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-draft-inbox-image-flare.mjs
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs
      - run: node scripts/test-marketing-renderer.mjs
      - run: node scripts/test-marketing-draft-inbox.mjs
      - name: Commit verified application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/test-marketing-generation.mjs scripts/test-marketing-draft-inbox.mjs .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate independent draft inbox and Flare image defaults'
            git push origin HEAD:feature/marketing-draft-inbox-image-flare
          fi
