name: Content copy review verification
on:
  push:
    branches: [codex/roundy-content-copy-review-fix-20261013]
    paths: ['.github/workflows/content-copy-review-verification.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/roundy-content-copy-review-fix-20261013
      - name: Apply verified two-file fix
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,subprocess
          from pathlib import Path
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==4546 and hashlib.sha256(patch).hexdigest()=='ff14ef81669e96bff6210c09772b87775055a4208dd37e6bcf941a50b85ccf48'
          expected={'src/lib/marketing-content-controller.ts','scripts/test-marketing-central-runtime.mjs'}
          assert {line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}==expected
          p=Path('/tmp/content-review.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/marketing-content-controller.ts scripts/test-marketing-central-runtime.mjs
          git rm .github/workflows/content-copy-review-verification.yml
          git commit -m 'fix(marketing): revalidate manually corrected copy without stale review latch'
          git push origin HEAD:codex/roundy-content-copy-review-fix-20261013
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/test-marketing-central-runtime.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
