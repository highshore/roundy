name: Apply verified Roundy legacy cleanup
on:
  push:
    branches: [cleanup/roundy-content-legacy-20261014]
permissions:
  contents: write
concurrency:
  group: roundy-legacy-cleanup-20261014
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'highshore/roundy' && github.event.head_commit.message == 'chore: stage verified Roundy cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply source-hash-locked changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 86e4b57c273193a55324cd409b941cbaee75d4bd
          python3 - <<'PY'
          import hashlib,json,lzma
          from pathlib import Path
          raw=lzma.decompress(Path('.roundy-maintenance/part1.xz').read_bytes()+Path('.roundy-maintenance/part2.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='c673bb53ed89ecdc7dc68dc3b319ba54fd71eff77aca81e20cfb13da71f1d800'
          records=json.loads(raw)
          paths=[]
          for r in records:
              p=Path(r['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith(('src/','scripts/','.github/workflows/ci.yml','package.json'))
              old=p.read_text() if p.exists() else ''
              digest=hashlib.sha256(old.encode()).hexdigest()
              if digest==r.get('new'):
                  paths.append(str(p));continue
              assert digest==r['old'],str(p)+' changed since audit'
              if r.get('delete'):
                  p.unlink()
              else:
                  lines=old.splitlines(True)
                  for start,end,text in reversed(r['edits']):
                      lines[start:end]=[text]
                  new=''.join(lines)
                  assert hashlib.sha256(new.encode()).hexdigest()==r['new'],str(p)+' output mismatch'
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(new)
              paths.append(str(p))
          Path('/tmp/roundy-changed-paths').write_text('\n'.join(paths)+'\n')
          print('Applied',len(paths),'verified source changes; no user data or database changes.')
          PY
      - run: npm ci
      - run: node scripts/prepare-marketing-fonts.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: node scripts/test-marketing-runtime-assets.mjs
      - name: Commit only verified source files to the cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git add --all --pathspec-from-file=/tmp/roundy-changed-paths
          git diff --cached --check
          cp .git/index /tmp/roundy-index
          git rm --cached .github/workflows/roundy-maintenance.yml .roundy-maintenance/part1.xz .roundy-maintenance/part2.xz
          test "$(git write-tree)" = 70bcdbd54a22d97f31a5f103ebfcd545631170cc
          cp /tmp/roundy-index .git/index
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(marketing): remove retired content editor and paid legacy generation'
          git push origin HEAD:cleanup/roundy-content-legacy-20261014
