name: Roundy scope check
on:
  push:
    branches: [codex/remove-business-talk]
permissions:
  contents: write
concurrency:
  group: roundy-business-scope
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve latest main and apply reviewed content cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          base64 -d .github/roundy-scope-edit.py.gz.b64 | gzip -dc > /tmp/roundy-scope-edit.py
          python3 /tmp/roundy-scope-edit.py
          cp /tmp/roundy-browser.mjs .roundy-browser.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.roundy-browser.mjs')
          s=p.read_text().replace("page.locator('.locale-toggle')", "page.locator('.locale-toggle button')")
          s=s.replace("for(const path of ['/discover'", "for(const path of ['/','/discover'")
          s=s.replace("const text=await page.locator('body').innerText();", "await page.waitForFunction(lang=>document.documentElement.lang===lang,locale); const text=await page.locator('body').innerText();")
          s=s.replace("assert.equal(res.headers().location,path.includes('ref=')?'/events?ref=ABC123':'/events');", "const location=new URL(res.headers().location,base);assert.equal(location.pathname+location.search,path.includes('ref=')?'/events?ref=ABC123':'/events');")
          p.write_text(s)
          p=Path('src/proxy.ts')
          s=p.read_text()
          marker='export async function proxy(request:NextRequest){'
          assert marker in s
          s="import { retiredEventDestination } from '@/lib/event-scope';\n"+s
          s=s.replace(marker,marker+"\n const retired=retiredEventDestination(request.nextUrl.pathname,request.nextUrl.searchParams.get('category'));\n if(retired){\n  const destination=request.nextUrl.clone();\n  destination.pathname=retired;\n  destination.searchParams.delete('category');\n  return NextResponse.redirect(destination,308);\n }",1)
          p.write_text(s)
          PY
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Scope and authentication regression checks
        run: |
          set -euo pipefail
          mkdir -p /tmp/roundy-qa
          node scripts/test-event-scope.mjs | tee /tmp/roundy-qa/scope-tests.txt
          node scripts/test-auth.mjs | tee /tmp/roundy-qa/auth-tests.txt
          node scripts/test-admin-routing.mjs | tee /tmp/roundy-qa/admin-routing-tests.txt
      - name: Check database suites and independently reproduce any pre-existing failures
        run: |
          git worktree add --detach /tmp/roundy-baseline origin/main
          ln -s "$PWD/node_modules" /tmp/roundy-baseline/node_modules
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          out=Path('/tmp/roundy-qa')
          summary=[]
          for name in ['database','event-management','feedback','legal-consent','match-flow']:
              script='scripts/test-'+name+'.mjs'
              current=subprocess.run(['node',script],capture_output=True,text=True)
              log=current.stdout+current.stderr
              (out/(name+'-tests.log')).write_text(log)
              if current.returncode==0:
                  print(log)
                  summary.append(name+': PASS')
                  continue
              # Only migration-only tests with unchanged inputs can be classified as baseline failures.
              subprocess.run(['git','diff','--exit-code','origin/main','--',script,'supabase/migrations'],check=True)
              assert 'src/' not in Path(script).read_text(), 'Source-dependent tests must pass'
              baseline=subprocess.run(['node',script],cwd='/tmp/roundy-baseline',capture_output=True,text=True)
              baseline_log=baseline.stdout+baseline.stderr
              (out/(name+'-baseline.log')).write_text(baseline_log)
              pattern=r'^(?:error:|Error:|TypeError:|AssertionError(?: \[.*?\])?:).*$'
              a=re.search(pattern,log,re.M);b=re.search(pattern,baseline_log,re.M)
              assert baseline.returncode!=0 and a and b and a.group()==b.group(), 'New or different regression: '+name
              message=name+': PRE-EXISTING on unchanged main and branch: '+a.group()
              print(message)
              summary.append(message)
          (out/'database-test-summary.txt').write_text('\n'.join(summary)+'\n')
          PY
      - run: npm run build
      - run: npm run typecheck
      - name: Install isolated browser tools
        run: |
          npm install --no-save --package-lock=false playwright agent-browser
          npx playwright install --with-deps chromium
      - name: Verify mobile and desktop browsers in Korean and English
        run: |
          set -euo pipefail
          mkdir -p /tmp/roundy-qa
          npm run start > /tmp/roundy-qa/server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/discover >/dev/null; then break; fi
            sleep 1
          done
          node .roundy-browser.mjs
      - name: Agent browser smoke check
        continue-on-error: true
        run: |
          npx agent-browser install
          npx agent-browser open http://127.0.0.1:3000/discover
          npx agent-browser wait --load networkidle
          npx agent-browser snapshot -i > /tmp/roundy-qa/agent-snapshot.txt
          npx agent-browser screenshot /tmp/roundy-qa/agent-smoke.png
          npx agent-browser close
      - name: Record verified source diff
        if: always()
        run: |
          mkdir -p /tmp/roundy-qa
          git diff --stat > /tmp/roundy-qa/change-stat.txt
          git diff -- src COPY.md package.json scripts > /tmp/roundy-qa/changes.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roundy-scope-qa
          path: /tmp/roundy-qa
          retention-days: 3
      - name: Commit tested changes on the working branch only
        run: |
          set -euo pipefail
          rm -f .roundy-browser.mjs .github/roundy-scope-edit.py.gz.b64 .github/workflows/roundy-scope-check.yml
          git add src scripts COPY.md package.json public/images .github
          git diff --cached --check
          git commit -m 'Remove Business Talk and One Cup content from Roundy'
          git push origin HEAD:codex/remove-business-talk
