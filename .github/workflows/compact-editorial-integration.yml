name: Compact editorial integration
on:
  push:
    branches: ['feat/compact-branded-editorial']
    paths:
      - 'scripts/apply-compact-editorial.mjs'
      - 'scripts/test-marketing-compact.mjs'
      - 'src/lib/marketing-presentation.ts'
      - 'src/lib/marketing-visuals.ts'
      - 'src/lib/marketing-render-assets.ts'
      - '.github/workflows/compact-editorial-integration.yml'
permissions:
  contents: write
concurrency:
  group: roundy-compact-editorial-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compact-branded-editorial
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-compact-editorial.mjs
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs
      - run: node scripts/test-marketing-renderer.mjs
      - run: node scripts/test-marketing-draft-inbox.mjs
      - run: node scripts/test-marketing-compact.mjs --render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-editorial-render-check
          path: quality-artifacts
          retention-days: 7
      - name: Commit tested integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src next.config.ts scripts/marketing-fixtures.cjs scripts/test-marketing-generation.mjs scripts/test-marketing-renderer.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate approved compact editorial generation and branded full-carousel rendering'
            git push origin HEAD:feat/compact-branded-editorial
          fi
