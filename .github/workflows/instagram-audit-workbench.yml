name: Instagram audit workbench
on:
  push:
    branches: [fix/instagram-workflow-audit-20261012]
    paths:
      - .github/workflows/instagram-audit-workbench.yml
      - scripts/instagram-audit.patch
permissions:
  contents: write
concurrency:
  group: instagram-audit-workbench
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/instagram-workflow-audit-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/instagram-workflow-audit-20261012
      - name: Apply exact reviewed edits, verifying old and new hashes
        if: hashFiles('scripts/instagram-audit.patch') != ''
        run: |
          python - <<'PY'
          import base64,gzip,json,hashlib,pathlib
          payload=''.join(pathlib.Path(p).read_text().strip() for p in ['scripts/instagram-audit.part1','scripts/instagram-audit.part2','scripts/instagram-audit.patch'])
          edits=json.loads(gzip.decompress(base64.b64decode(payload)))
          for item in edits:
            p=pathlib.Path(item['path'])
            assert not p.is_absolute() and '..' not in p.parts
            assert p.parts[0] in ('src','scripts','docs','supabase') or str(p) in ('package.json','package-lock.json')
            old=p.read_text() if p.exists() else ''
            assert (hashlib.sha256(old.encode()).hexdigest() if p.exists() else None)==item['before'], str(p)
            result=old
            for a,b,text in reversed(item['edits']):
              assert 0<=a<=b<=len(old)
              result=result[:a]+text+result[b:]
            assert hashlib.sha256(result.encode()).hexdigest()==item['after'], str(p)
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_text(result)
          PY
      - uses: actions/setup-node@v4
        if: hashFiles('scripts/instagram-audit.patch') != ''
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and generate forward-only migration
        if: hashFiles('scripts/instagram-audit.patch') != ''
        run: |
          npm ci
          npx --no-install supabase migration new --help
          npx --no-install supabase migration new instagram_editorial_workflow
          cp scripts/marketing-workflow-schema.sql "$(ls -t supabase/migrations/*_instagram_editorial_workflow.sql | head -1)"
      - name: Typecheck, regressions and rendering without live AI or posting
        if: hashFiles('scripts/instagram-audit.patch') != ''
        run: |
          npm run typecheck
          npm test
          for test in scripts/test-marketing-*.mjs; do node "$test"; done
          node scripts/test-marketing-compact.mjs --render
          npm run build
      - name: Commit verified implementation to isolated branch
        if: hashFiles('scripts/instagram-audit.patch') != ''
        run: |
          test "$(git branch --show-current)" = 'fix/instagram-workflow-audit-20261012'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts docs supabase package.json package-lock.json
          git rm scripts/instagram-audit.part1 scripts/instagram-audit.part2 scripts/instagram-audit.patch .github/workflows/instagram-audit-workbench.yml
          git commit -m 'fix(marketing): resilient editorial workflow and focused content studio'
          git push origin HEAD:fix/instagram-workflow-audit-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-audit-render-qa
          path: quality-artifacts
          if-no-files-found: ignore
          retention-days: 3
