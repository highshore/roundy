name: Editorial overhaul workbench
on:
  push:
    branches: [codex/roundy-editor-first-20261013]
    paths: [.github/workflows/editor-first-workbench.yml, scripts/editor-first-patch.py]
permissions:
  contents: write
concurrency:
  group: editorial-overhaul-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/roundy-editor-first-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply audited patch when present
        run: |
          if [ -f scripts/editor-first-patch.py ]; then
            python3 scripts/editor-first-patch.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src scripts package.json docs
            if ! git diff --cached --quiet; then
              git commit -m 'feat(marketing): implement editor-first content studio'
              git push origin HEAD:codex/roundy-editor-first-20261013
            fi
          fi
      - name: Source inspection package
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=quality-artifacts -czf /tmp/roundy-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roundy-source
          path: /tmp/roundy-source.tar.gz
          retention-days: 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:marketing-editor-first
      - run: node scripts/test-marketing-compact.mjs --render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-overhaul-qa
          path: quality-artifacts
          retention-days: 2
