name: Backend resilience verification
on:
  push:
    branches: [codex/roundy-backend-resilience-20261013]
    paths: ['scripts/backend-audit-transport/**', '.github/workflows/backend-resilience-workbench.yml']
permissions:
  contents: write
concurrency:
  group: roundy-backend-resilience-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/roundy-backend-resilience-20261013
      - name: Apply reviewed backend fixes and remove transport
        run: |
          python3 scripts/backend-audit-transport/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/instagram-backend-resilience-audit-20261013.md next.config.ts package.json scripts/test-marketing-backend-resilience.mjs scripts/test-marketing-generation-retry.mjs scripts/test-marketing-generation.mjs src/components/admin-marketing.tsx src/lib/marketing-content-policy.ts src/lib/marketing-editorial.ts src/lib/marketing-generation-retry.ts src/lib/marketing-generation.ts src/lib/marketing-prompt-budget.ts src/lib/marketing-render-assets.ts src/lib/marketing-stock-photos.ts src/lib/marketing-workflow.ts src/lib/marketing.ts
          git rm -r scripts/backend-audit-transport .github/workflows/backend-resilience-workbench.yml
          git commit -m 'fix(marketing): harden research recovery, media persistence and failure handling'
          git push origin HEAD:codex/roundy-backend-resilience-20261013
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs
      - run: node scripts/test-marketing-prompt-budget.mjs
      - run: node scripts/test-marketing-compact.mjs --render
