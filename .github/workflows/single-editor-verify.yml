name: Verify consolidated editor
on:
  push:
    branches: [codex/single-card-editor-work-20261013]
    paths: [.github/workflows/single-editor-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct reviewed source with base and result hashes
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          encoded=''.join(Path('.automation/single-editor.delta.'+str(n)).read_text().strip() for n in [1,2])
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='e06a08b4310ffb7811406e334c9d25753681705483e3a0fb9af3c333992582a8'
          allowed={'package.json','scripts/marketing-single-editor-fixture.cjs','scripts/test-marketing-generator-interactions.mjs','scripts/test-marketing-preflight.mjs','scripts/test-marketing-single-editor.mjs','src/components/admin-marketing-editorial-studio.css','src/components/admin-marketing-editorial-studio.tsx','src/components/admin-marketing-regeneration.tsx','src/components/admin-marketing.tsx','src/lib/marketing-preflight.ts'}
          entries=json.loads(raw)
          assert {r['path'] for r in entries}==allowed
          for row in entries:
              path=Path(row['path']);before=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest()==row['base'],str(path)+' base changed'
              old=before.decode();result=''.join(old[op[0]:op[1]] if isinstance(op,list) else op for op in row['ops']).encode()
              assert hashlib.sha256(result).hexdigest()==row['sha256'],str(path)+' result mismatch'
              path.write_bytes(result)
          Path('/tmp/reviewed-paths.json').write_text(json.dumps(sorted(allowed)))
          print('Restored exactly 10 locally reviewed files; no production credentials or data used.')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:marketing-single-editor
      - run: node scripts/test-marketing-preflight.mjs
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs && node scripts/test-marketing-mobile-layout.mjs && node scripts/test-marketing-draft-inbox.mjs
      - name: Store tested source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const path of JSON.parse(fs.readFileSync('/tmp/reviewed-paths.json','utf8'))){
           const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json',Accept:'application/vnd.github+json'},body:JSON.stringify({encoding:'utf-8',content:fs.readFileSync(path,'utf8')})});
           if(!response.ok)throw Error('Source blob write failed: '+response.status);
           const blob=await response.json();console.log(JSON.stringify({path,sha:blob.sha}));
          }
          JS
