name: Verify editorial cost labels
on:
  push:
    branches: ['fix/marketing-editorial-quality-v2']
    paths: ['.github/workflows/quality-ui-labels-once.yml']
permissions:
  contents: write
jobs:
  update-labels:
    if: github.ref == 'refs/heads/fix/marketing-editorial-quality-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-editorial-quality-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/admin-marketing.tsx')
          s=p.read_text()
          replacements={
            "'API attempts today','오늘 API 요청'":"'Paid generation attempts','오늘 유료 생성 시도'",
            'This starts one new API request and reserves ':'This starts one generation attempt (research uses at most one search and one writing request) and reserves ',
            '새 API 요청 1회를 시작하며 앱 예산 ':'생성 시도 1회를 시작합니다. 검색형은 검색 1회와 문구 작성 1회까지 사용하며, 앱 예산 '
          }
          for old,new in replacements.items():
            if old not in s: raise RuntimeError('Missing expected label: '+old)
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-marketing-generation.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin-marketing.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Clarify that one research attempt uses up to two paid requests'
            git push origin HEAD:fix/marketing-editorial-quality-v2
          fi
