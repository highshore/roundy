name: Marketing generator repair verification
on:
  push:
    branches: [codex/marketing-generator-repair-run-20261012]
permissions:
  contents: read
concurrency:
  group: marketing-generator-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce original generator state failure
        continue-on-error: true
        run: node scripts/test-marketing-generator-interactions.mjs
      - name: Apply reviewed source repair
        run: python3 .automation/repair-marketing-generator.py
      - run: npm run typecheck
      - run: npm run test:marketing-generator-ui
      - run: npm test
      - name: Store tested source blobs for reviewed merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const paths=['src/components/admin-marketing.tsx','src/lib/marketing-generator-ui.ts','scripts/test-marketing-generator-interactions.mjs','package.json'];
          for(const path of paths){
            const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json',Accept:'application/vnd.github+json'},body:JSON.stringify({encoding:'utf-8',content:fs.readFileSync(path,'utf8')})});
            if(!response.ok)throw Error('Blob write failed '+response.status);
            const data=await response.json();console.log(JSON.stringify({path,sha:data.sha}));
          }
          JS
