name: Marketing limit verification
on:
  push:
    branches: [fix/marketing-test-limit-50]
    paths: [.github/workflows/marketing-limit-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read active quota settings instead of legacy display constants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/marketing-generation.ts')
          content=p.read_text()
          old='daily_call_limit:10,monthly_call_limit:180,photo_daily_limit:5,photo_monthly_limit:90'
          new='daily_call_limit:Number(control.daily_call_limit??10),monthly_call_limit:Number(control.monthly_call_limit??180),render_daily_limit:Number(control.render_daily_limit??10),photo_daily_limit:Number(control.daily_call_limit??10),photo_monthly_limit:Number(control.monthly_call_limit??180)'
          assert content.count(old)==1, 'Quota display changed; inspect before editing'
          p.write_text(content.replace(old,new))
          Path('docs/marketing-test-limits.md').write_text('''# Marketing test limits\n\nUser-authorized test configuration: 50 paid generation jobs per KST day, 1,500 per KST month, and 50 no-AI render jobs per day. Generating copy, regenerating copy, or subsequently generating an AI cover may consume separate paid jobs. These are job limits, not guaranteed numbers of completed posts.\n\nApplication reservation guardrails are USD 15/day and USD 300/month. Reservations are estimates, not provider invoices or a guarantee of the provider account balance. No credits were purchased. Failed reservations remain in the budget; the existing counted-job semantics are unchanged.\n\nDatabase fields marketing_ai_control.daily_call_limit, monthly_call_limit and render_daily_limit are read by the reservation function and the admin usage summary. Production settings were updated by the marketing_test_generation_limits migration. No automatic expiry was requested. To end testing, restore limits 10/180/10 and budgets 5/20 in the same control row.\n\nAutomatic generation frequency, publication frequency, manual approval, source and photo review, 30-second cooldown, one-active-job lock, idempotency and uncertain-outcome safeguards are unchanged. No live generation or posting is performed by tests.\n''')
          PY
      - name: Record idempotent schema migration with the installed CLI
        run: |
          npx --no-install supabase migration new --help
          npx --no-install supabase migration new marketing_test_generation_limits
          TARGET="$(ls -t supabase/migrations/*_marketing_test_generation_limits.sql | head -1)"
          cat > "$TARGET" <<'SQL'
          begin;
          select pg_advisory_xact_lock(70361005);
          alter table public.marketing_ai_control
           add column if not exists daily_call_limit integer not null default 10 check (daily_call_limit between 1 and 50),
           add column if not exists monthly_call_limit integer not null default 180 check (monthly_call_limit between 1 and 1500),
           add column if not exists render_daily_limit integer not null default 10 check (render_daily_limit between 1 and 50);
          alter table public.marketing_ai_control drop constraint marketing_ai_control_daily_budget_usd_check;
          alter table public.marketing_ai_control add constraint marketing_ai_control_daily_budget_usd_check check (daily_budget_usd between 0 and 15.00);
          alter table public.marketing_ai_control drop constraint marketing_ai_control_monthly_budget_usd_check;
          alter table public.marketing_ai_control add constraint marketing_ai_control_monthly_budget_usd_check check (monthly_budget_usd between 0 and 300.00);
          do $limits$
          declare definition text;
          begin
           definition:=pg_get_functiondef('public.reserve_marketing_generation(text,text,uuid,integer,text,uuid,boolean)'::regprocedure);
           if position('daily_count>=10 or monthly_count>=180' in definition)>0
            and position('operation=''render'')>=10' in definition)>0 then
            definition:=replace(definition,'daily_count>=10 or monthly_count>=180','daily_count>=c.daily_call_limit or monthly_count>=c.monthly_call_limit');
            definition:=replace(definition,'operation=''render'')>=10','operation=''render'')>=c.render_daily_limit');
            execute definition;
           elsif position('daily_count>=c.daily_call_limit or monthly_count>=c.monthly_call_limit' in definition)=0
            or position('operation=''render'')>=c.render_daily_limit' in definition)=0 then
            raise exception 'GENERATION_LIMIT_FUNCTION_CHANGED_REVIEW_REQUIRED';
           end if;
          end;
          $limits$;
          -- Preserve actual row settings on subsequent replays, including a later end to testing.
          -- Production test values are intentionally not hardcoded in schema replay.
          commit;
          SQL
      - name: Verify without paid API calls or Instagram publishing
        run: |
          npm run typecheck
          node scripts/test-marketing-generation.mjs
          npm test
      - name: Commit verified changes on the isolated branch
        run: |
          test "$(git branch --show-current)" = 'fix/marketing-test-limit-50'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/marketing-generation.ts docs/marketing-test-limits.md supabase/migrations
          git rm .github/workflows/marketing-limit-workbench.yml
          git commit -m 'fix(marketing): display database-backed test quotas accurately'
          git push origin HEAD:fix/marketing-test-limit-50
