name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-marketing-fonts.mjs
      - run: npm run typecheck
      - run: node scripts/test-marketing-trend-guides.mjs
      - run: node scripts/test-marketing-trend-radar.mjs
      - run: node scripts/test-marketing-growth.mjs
      - run: node scripts/test-marketing-photo-intent.mjs
      - run: node scripts/test-marketing-reels.mjs
      - run: node scripts/test-marketing-reel-creative.mjs
      - run: node scripts/test-marketing-performance.mjs
      - run: node scripts/test-marketing-meta-worker.mjs
      - run: node scripts/test-marketing-mobile-layout.mjs
      - run: node scripts/test-marketing-generation.mjs
      - run: node scripts/test-marketing-prompt-budget.mjs
      - run: node scripts/test-marketing-magazine.mjs
      - run: npm test
      - run: node scripts/test-marketing-compact.mjs
      - run: node scripts/test-marketing-compact-runtime.mjs
      - run: node scripts/test-marketing-output-recovery.mjs
      - run: node scripts/test-marketing-renderer.mjs
      - run: node scripts/test-marketing-draft-inbox.mjs
      - run: node scripts/test-rotation-dating-copy.mjs
      - run: node scripts/test-marketing-compact.mjs --render
      - name: Production build with pinned server assets
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Real bilingual rendering and deployment file traces
        run: node scripts/test-marketing-runtime-assets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: marketing-editorial-render-qa
          path: quality-artifacts
          retention-days: 7
