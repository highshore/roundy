name: Final backend verification
on:
  push:
    branches: [codex/roundy-backend-resilience-20261013]
    paths: ['.github/workflows/backend-final-verification.yml']
permissions:
  contents: read
concurrency:
  group: roundy-backend-final-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package isolated source and dependency environment
        run: |
          git rev-parse HEAD > verified-head.txt
          tar --exclude=.git --exclude='.env*' --exclude=.vercel --exclude=.next --exclude=quality-artifacts --exclude='node_modules/@next/swc-*' -czf /tmp/roundy-verification-env.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roundy-verification-env
          path: /tmp/roundy-verification-env.tar.gz
          retention-days: 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
