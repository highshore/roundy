name: Final backend verification
on:
  push:
    branches: [codex/roundy-backend-resilience-20261013]
    paths: ['.github/workflows/backend-final-verification.yml', 'scripts/backend-final-patch.py']
permissions:
  contents: write
concurrency:
  group: roundy-backend-final-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/roundy-backend-resilience-20261013
      - name: Apply reviewed patch
        run: |
          if [ -f scripts/backend-final-patch.py ]; then
            python3 scripts/backend-final-patch.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/marketing-render-assets.ts src/lib/marketing-generated-assets.ts src/lib/marketing-generation.ts scripts/prepare-marketing-fonts.mjs scripts/test-marketing-backend-resilience.mjs scripts/test-marketing-generated-assets.mjs scripts/test-marketing-runtime-assets.mjs package.json next.config.ts .gitignore docs/instagram-backend-resilience-audit-20261013.md
            git rm scripts/backend-final-patch.py
            git commit -m 'fix(marketing): bundle fonts and persist paid AI cards before rendering'
            git push origin HEAD:codex/roundy-backend-resilience-20261013
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs
      - run: node scripts/test-marketing-prompt-budget.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run test:marketing-runtime-assets
      - name: Verify bundled function font traces
        run: |
          node -e 'const fs=require("fs");for(const p of [".next/server/app/api/internal/marketing-generation/route.js.nft.json",".next/server/app/api/admin/marketing/[[...marketingPath]]/route.js.nft.json"]){const s=fs.readFileSync(p,"utf8");for(const f of ["NotoSansCJKkr-Regular.otf","NotoSansCJKkr-Black.otf","dm-sans-latin-400-normal.woff","dm-sans-latin-700-normal.woff"])if(!s.includes(f))throw Error("Missing "+f+" in "+p);console.log("PASS font trace",p)}'
