name: Refresh Roundy hero images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-roundy-hero-images.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download high-resolution Figma source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --location --retry 3 --output public/images/roundy-mingle-hero.png "https://www.figma.com/api/mcp/asset/08984959-5849-49a2-bbbf-f60c8e66b054"
          curl --fail --location --retry 3 --output public/images/roundy-business-hero.png "https://www.figma.com/api/mcp/asset/30ffba99-b73e-4d98-846e-b876849a4888"

      - name: Verify image resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              "public/images/roundy-mingle-hero.png": (1000, 560),
              "public/images/roundy-business-hero.png": (1000, 560),
          }

          for filename, (min_w, min_h) in expected.items():
              data = Path(filename).read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{filename}: not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              print(f"{filename}: {width}x{height}, {len(data)} bytes")
              if width < min_w or height < min_h:
                  raise SystemExit(f"{filename}: resolution is too low")
          PY

      - name: Point homepage carousel at the high-resolution assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/app.tsx")
          text = p.read_text()
          old_mingle = "/images/roundy-mingle-hero.webp"
          old_business = "/images/roundy-business-hero.webp"
          if old_mingle not in text or old_business not in text:
              raise SystemExit("Expected homepage hero asset paths were not found.")
          text = text.replace(old_mingle, "/images/roundy-mingle-hero.png")
          text = text.replace(old_business, "/images/roundy-business-hero.png")
          p.write_text(text)
          PY
          rm -f public/images/roundy-mingle-hero.webp public/images/roundy-business-hero.webp
          rm -f .github/workflows/refresh-roundy-hero-images.yml

      - name: Commit refreshed hero assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use high-resolution homepage hero images"
          git push
