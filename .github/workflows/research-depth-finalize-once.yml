name: Research depth finalize
on:
  push:
    branches: ['fix/marketing-research-depth']
    paths: ['scripts/finalize-research-depth.mjs']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketing-research-depth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-research-depth.mjs
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/test-marketing-generation.mjs
      - name: Commit verified application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin-marketing.tsx scripts/test-marketing-generation.mjs docs/marketing-editorial-quality.md
          if ! git diff --cached --quiet; then
            git commit -m 'Align deep research labels, tests and budget'
            git push origin HEAD:fix/marketing-research-depth
          fi
